services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /etc/livekit-entrypoint.sh
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-YOUR_DOMAIN.dev}
      LIVEKIT_TURN_TLS_PORT: ${LIVEKIT_TURN_TLS_PORT:-}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_EXTERNAL_TLS: ${LIVEKIT_TURN_EXTERNAL_TLS:-}
      LIVEKIT_TURN_CERT: ${LIVEKIT_TURN_CERT:-}
      LIVEKIT_TURN_KEY: ${LIVEKIT_TURN_KEY:-}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "${LIVEKIT_TURN_TLS_PORT:-5349}:${LIVEKIT_TURN_TLS_PORT:-5349}"
      - "50000-50100:50000-50100/udp"
      - "51000-51100:51000-51100/udp"
    volumes:
      - ./infra/media/livekit.yaml:/etc/livekit-base.yaml:ro
      - ./infra/media/livekit-entrypoint.sh:/etc/livekit-entrypoint.sh:ro
      - ./certs:/etc/livekit-certs:ro
    depends_on:
      redis:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -lc "pnpm --filter @poker/db prisma db push && pnpm --filter @poker/api start"
    env_file:
      - .env.example
    environment:
      ROOM_CREATION_ADMIN_ONLY: ${ROOM_CREATION_ADMIN_ONLY:-false}
      ROOM_CREATION_ADMIN_USERNAME: ${ROOM_CREATION_ADMIN_USERNAME:-}
      ROOM_CREATION_ADMIN_PASSWORD: ${ROOM_CREATION_ADMIN_PASSWORD:-}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_TLS_PORT: ${LIVEKIT_TURN_TLS_PORT:-}
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy

  game:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/game/Dockerfile
    env_file:
      - .env.example
    environment:
      ROOM_CREATION_ADMIN_ONLY: ${ROOM_CREATION_ADMIN_ONLY:-false}
      ROOM_CREATION_ADMIN_USERNAME: ${ROOM_CREATION_ADMIN_USERNAME:-}
      ROOM_CREATION_ADMIN_PASSWORD: ${ROOM_CREATION_ADMIN_PASSWORD:-}
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env.example
    environment:
      GAME_INTERNAL_BASE_URL: http://game:4200
      HOUSE_RULES_CONFIG_PATH: /app/config/house-rules.json
      POKER_BRAND_NAME: ${POKER_BRAND_NAME:-Poker}
      ROOM_CREATION_ADMIN_ONLY: ${ROOM_CREATION_ADMIN_ONLY:-false}
      ROOM_CREATION_ADMIN_USERNAME: ${ROOM_CREATION_ADMIN_USERNAME:-}
    ports:
      - "3000:3000"
    volumes:
      - ./config/house-rules.json:/app/config/house-rules.json:ro
    depends_on:
      api:
        condition: service_started
      game:
        condition: service_started
      livekit:
        condition: service_started

volumes:
  postgres-data:
